name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Point project to SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Gradle manually (no wrapper binary needed)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "GRADLE_BIN=$PWD/gradle-8.6/bin/gradle" >> $GITHUB_ENV

      - name: Build debug APK
        run: $GRADLE_BIN assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
